<script>

 top.forEach((part,ci)=>{const len=part.c*unit;arrow(x+2,origin-12,x+len-2,origin-12);label(x+len/2,origin-34,part,toneInk('cols',ci));x+=len});

}
const tone=(kind,index)=>'rgb('+MODEL_PALETTE[kind][index%MODEL_PALETTE[kind].length].join(',')+')';
const mixedTone=(ri,ci)=>'rgb('+MODEL_PALETTE.cols[ci%MODEL_PALETTE.cols.length].map((v,k)=>Math.round(.52*v+.48*MODEL_PALETTE.rows[ri%MODEL_PALETTE.rows.length][k])).join(',')+')';
const $=id=>document.getElementById(id);let mode='units',current=null;
const fmt=n=>String(n).replace(/^-/, '−');const signTerm=(c,p,first)=>{if(!c)return '';let s=c<0?'−':first?'':'+';let a=Math.abs(c);return s+(p?(a===1?'':a)+(p===2?'x²':'x'):a)};
function polyText(p){let out='';for(let i=2;i>=0;i--)if(p[i])out+=signTerm(p[i],i,!out);return out||'0'}
function parse(raw){let s=raw.replace(/\s/g,'').replace(/−/g,'-').replace(/\*/g,'').replace(/\(/g,'').replace(/\)/g,'');if(!s||!/^[+\-\dxX]+$/.test(s))throw Error('Use numbers and x, such as 34, 2x+3, or x−5.');s=s.replace(/X/g,'x').replace(/x/g,'x');if(!/^[+-]/.test(s))s='+'+s;let parts=s.match(/[+-][^+-]+/g)||[];let out=[0,0,0];for(let t of parts){let sign=t[0]==='-'?-1:1,v=t.slice(1);if(/^\d+$/.test(v))out[0]+=sign*Number(v);else if(/^(\d*)x$/.test(v))out[1]+=sign*Number(v.slice(0,-1)||1);else throw Error('Each factor can contain constants and x terms (no powers yet).')}if(!Number.isSafeInteger(out[0])||!Number.isSafeInteger(out[1]))throw Error('Number is too large.');return out}
function parts(p){if(p[1]){let a=[];if(p[1])a.push({c:p[1],pow:1});if(p[0])a.push({c:p[0],pow:0});return a}let n=p[0],sg=Math.sign(n)||1,abs=Math.abs(n);if(abs===0)return [{c:0,pow:0}];let digs=String(abs).split('').map((v,i)=>Number(v)*10**(String(abs).length-i-1)).filter(Boolean);return digs.map(c=>({c:c*sg,pow:0}))}
function textTerm(t){return polyText([t.pow===0?t.c:0,t.pow===1?t.c:0,t.pow===2?t.c:0])}

function result(p,q){return [p[0]*q[0],p[0]*q[1]+p[1]*q[0],p[1]*q[1]]}

function cell(t){return safe(textTerm(t))}
function render(){if(!current)return;let {p,q,top,left,r}=current;let hide=false,heading={units:'Unit squares',squares:'Unit squares / partitioned area',tiles:'Algebra tiles',numeric:'Representative / numeric area model',algorithm:'Multiplication algorithm'};let descriptions={units:'Uniform 1 × 1 grid, no place-value boundaries',squares:'Area shown with unit squares where practical',tiles:'x², x, and unit regions',numeric:'Place-value partitions and partial products',algorithm:'Written multiplication or symbolic distribution'};$('heading').textContent=heading[mode];$('description').textContent=descriptions[mode];$('stage').innerHTML='';if(mode==='units')drawUnits(top,left);if(mode==='numeric')drawNumeric(top,left,hide);if(mode==='squares')drawSquares(top,left,hide);if(mode==='tiles')drawTiles(top,left,hide);if(mode==='algorithm')drawAlgorithm(p,q,top,left,hide);let terms=left.flatMap(l=>top.map(t=>product(l,t)));let expansion=terms.map((t,i)=> (i?' + ':'')+'('+textTerm(t)+')').join('').replace(/\+ \(−/g,'− (');$('steps').innerHTML='<strong>Distributive property</strong><div class="math">('+safe(polyText(p))+')('+safe(polyText(q))+') = '+safe(left.map(l=>top.map(t=>textTerm(l)+'('+textTerm(t)+')').join(' + ')).join(' + '))+'</div>'+(hide?'<div class="muted">Reveal products and totals to complete the calculation.</div>':'<div class="math">Partial products: '+safe(terms.map(textTerm).join(' + ').replace(/\+ −/g,'− '))+'</div><div class="math"><strong>Total: '+safe(polyText(r))+'</strong></div>')}

 const cuts=arr=>{let res=[0];arr.forEach(t=>res.push(res.at(-1)+t.c));return res};

 const add=(tag,attrs)=>{let e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));svg.appendChild(e);return e};

   add('rect',{x:origin+xc[ci]*unit,y:origin+yc[ri]*unit,width:top[ci].c*unit,height:left[ri].c*unit,fill:mixedTone(ri,ci)});

 drawDimensionArrows(svg,ns,origin,unit,top,left);

function drawSquares(top,left,hide){

 const unit=Math.max(2,Math.min(20,Math.floor(690/Math.max(w,h)))),origin=72,ns='http://www.w3.org/2000/svg';

  const bands=n=>{let a=[];for(let i=0;i<Math.floor(n/10);i++)a.push(10);for(let i=0;i<n%10;i++)a.push(1);return a};

 const corner=document.createElement('div');corner.textContent='·';corner.style.cssText='display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;position:relative';place(corner,1,1);const cornerH=document.createElement('div');cornerH.style.cssText='background:#24394e';place(cornerH,2,1);const cornerV=document.createElement('div');cornerV.style.cssText='background:#24394e';place(cornerV,1,2);

 const vLine=document.createElement('div');vLine.style.background='#24394e';place(vLine,2,2,rows.length+1,1);
 cols.forEach((c,j)=>place(add(c),1,j+3));
 rows.forEach((r,i)=>{place(add(r,r.pow===1),i+3,1);cols.forEach((c,j)=>place(add({pow:r.pow+c.pow,sign:r.sign*c.sign}),r.pow===1&&c.pow===0),i+3,j+3))});
 wrap.appendChild(root);stage.appendChild(wrap);
 const note=document.createElement('p');note.className='tileNote';note.textContent=rows.length+' tiles along the left edge × '+cols.length+' tiles along the top edge. Interior tiles represent their pairwise products.';stage.appendChild(note);
}
function drawAlgorithm(p,q,top,left,hide){
 const d=document.createElement('div');d.className='algorithm';d.setAttribute('aria-label','Standard multiplication algorithm');
 const add=(value,bg,bold)=>{const line=document.createElement('div');line.className='alg-line';line.textContent=value;if(bg)line.style.backgroundColor=bg;if(bold)line.style.fontWeight='850';d.appendChild(line)};
 const rule=()=>{const line=document.createElement('div');line.className='alg-rule';d.appendChild(line)};
 const factorLine=(value,groups,axis,prefix)=>{
  const line=document.createElement('div');line.className='alg-line';line.style.fontWeight='850';
  if(prefix){line.appendChild(document.createTextNode(prefix))}
  const digits=String(value),raw=digits.replace('-','');let position=0;
  for(const character of digits){
    const span=document.createElement('span');span.textContent=character;
    if(/[0-9]/.test(character)){
      const exp=raw.length-1-position;
      const amount=Number(character)*10**exp;
      const idx=groups.findIndex(t=>t.pow===0&&Math.abs(t.c)===amount);
      span.style.color=idx>=0?toneInk(axis,idx):'#52667c';
      position++;
    }
    line.appendChild(span);
  }
  d.appendChild(line);
 };
 if(!p[1]&&!q[1]&&Number.isInteger(p[0])&&Number.isInteger(q[0])){
  const a=p[0],b=q[0],digits=String(Math.abs(b)).split('').reverse();
  factorLine(a,left,'rows','');factorLine(b,top,'cols','× ');rule();
  if(digits.length>1){
    digits.forEach((digit,i)=>{
      const part=Number(digit)*a*10**i*(b<0?-1:1);
      const idx=top.findIndex(t=>t.pow===0&&Math.abs(t.c)===Number(digit)*10**i);
      add(hide?'?':String(part),idx>=0?tone('cols',idx):null,false);
    });
    rule();
  }
  add(hide?'?':String(a*b),null,true);
 }else{
  add('('+polyText(p)+')');add('× ('+polyText(q)+')');rule();
  const parts=[];
  if(q[0])parts.push({value:polyText([p[0]*q[0],p[1]*q[0],0]),index:top.findIndex(t=>t.pow===0)});
  if(q[1])parts.push({value:polyText([0,p[0]*q[1],p[1]*q[1]]),index:top.findIndex(t=>t.pow===1)});
  if(parts.length>1){parts.forEach(t=>add(hide?'?':t.value,t.index>=0?tone('cols',t.index):null));rule()}
  add(hide?'?':polyText(result(p,q)),null,true);
 }
 $('stage').appendChild(d);
}
function build(){try{let p=parse($('a').value),q=parse($('b').value);if(Math.max(Math.abs(p[0]),Math.abs(q[0]))>99999||Math.max(Math.abs(p[1]),Math.abs(q[1]))>999)throw Error('For readability, use constants up to 99,999 and x coefficients up to 999.');current={p,q,top:parts(q),left:parts(p),r:result(p,q)};$('error').textContent='';render()}catch(e){$('error').textContent=e.message}}
document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b===btn);b.setAttribute('aria-selected',String(b===btn))});render()});['a','b'].forEach(id=>{ $(id).addEventListener('input',()=>{clearTimeout(window._update);window._update=setTimeout(build,220)});$(id).addEventListener('keydown',e=>{if(e.key==='Enter')build()})});build();
