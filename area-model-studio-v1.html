   const a=p[0],b=q[0],digits=String(Math.abs(b)).split('').reverse(),multSign=b<0?-1:1;
   topLine=String(a);bottomLine='× '+String(b);finalLine=hide?'?':String(a*b);
   if(digits.length>1)partials=digits.map((v,i)=>({text:hide?'?':String(a*Number(v)*10**i*multSign),color:tone('cols',Math.max(0,top.length-1-i))}));
 }else{
   topLine='('+polyText(p)+')';bottomLine='× ('+polyText(q)+')';finalLine=hide?'?':polyText(result(p,q));
   const terms=[];
   if(q[0])terms.push({text:polyText([p[0]*q[0],p[1]*q[0],0]),color:tone('cols',top.findIndex(t=>t.pow===0)>=0?top.findIndex(t=>t.pow===0):0)});
   if(q[1])terms.push({text:polyText([0,p[0]*q[1],p[1]*q[1]]),color:tone('cols',top.findIndex(t=>t.pow===1)>=0?top.findIndex(t=>t.pow===1):0)});
   if(terms.length>1)partials=terms.map(t=>({text:hide?'?':t.text,color:t.color}));
 }
 const add=(textValue,bg,bold)=>{const line=document.createElement('div');line.className='alg-line';line.textContent=textValue;if(bg)line.style.backgroundColor=bg;if(bold)line.style.fontWeight='850';d.appendChild(line)};
 const rule=()=>{const line=document.createElement('div');line.className='alg-rule';d.appendChild(line)};
 add(topLine);add(bottomLine);rule();
 partials.forEach(t=>add(t.text,t.color));
 if(partials.length>0)rule();
 add(finalLine,null,true);
 $('stage').appendChild(d);
}
function build(){try{let p=parse($('a').value),q=parse($('b').value);if(Math.max(Math.abs(p[0]),Math.abs(q[0]))>99999||Math.max(Math.abs(p[1]),Math.abs(q[1]))>999)throw Error('For readability, use constants up to 99,999 and x coefficients up to 999.');current={p,q,top:parts(q),left:parts(p),r:result(p,q)};$('error').textContent='';render()}catch(e){$('error').textContent=e.message}}
document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b===btn);b.setAttribute('aria-selected',String(b===btn))});render()});['a','b'].forEach(id=>{ $(id).addEventListener('input',()=>{clearTimeout(window._update);window._update=setTimeout(build,220)});$(id).addEventListener('keydown',e=>{if(e.key==='Enter')build()})});build();
</script></body></html>
