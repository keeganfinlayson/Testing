<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Area Model Studio v1.7</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#19283c;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:1.6rem;margin:0}p{color:#546579}header{margin-bottom:18px}.panel{background:white;border:1px solid #dce3ec;border-radius:14px;padding:18px;margin-bottom:16px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{font-size:.85rem;font-weight:650;display:grid;gap:5px}input,select,button{font:inherit;border:1px solid #b8c5d5;border-radius:8px;padding:9px 11px;background:white;color:#19283c}input{width:175px}button{cursor:pointer}button:hover{border-color:#466ca5}button.active{background:#204f8a;color:white;border-color:#204f8a}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{flex:1;min-width:135px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.muted{color:#66768a;font-size:.88rem}.math{font-size:1.12rem;overflow-wrap:anywhere}.error{color:#a11d2c;min-height:1.3em}.stage{overflow:auto;min-height:280px;padding:16px 6px}.gridModel{display:grid;gap:3px;min-width:450px;max-width:850px;margin:auto}.cell,.head{display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;min-width:55px;min-height:55px;border-radius:3px}.head{font-weight:700;background:#edf1f7}.cell{border:1px solid #7d9dbb;background:#d9eaf9;position:relative;flex-direction:column;gap:7px}.cell:nth-child(3n){background:#d8eee5}.cell small{color:#42566d}.tileStage{display:flex;justify-content:center;align-items:center;min-height:320px}.tileGrid{display:grid;border:2px solid #52667e;background:#fff;gap:1px;max-width:100%;overflow:auto}.tile{display:flex;align-items:center;justify-content:center;border:1px solid #597d9b;background:#b9d9f5;color:#163b62;font-weight:650;font-size:.85rem;min-width:23px;min-height:23px}.tile.x2{background:#9fc7ed}.tile.x{background:#c3e4d4;color:#174b36}.tile.unit{background:#f8e3b4;color:#6c4d15}.tile.neg{background:#f4c3c3;color:#812b2b}.tileNote{font-size:.85rem;color:#586a7d;text-align:center;margin-top:8px}.algorithm{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:1.25rem;white-space:pre;line-height:1.7;display:table;margin:10px auto}.steps{background:#f7f9fc;border:1px solid #e3e9f0;border-radius:9px;padding:13px 16px;line-height:1.8}.examples{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.examples button{font-size:.85rem;padding:6px 9px}.pill{font-size:.78rem;background:#eef3fa;padding:4px 8px;border-radius:20px}.sr{position:absolute;left:-9999px}@media(max-width:600px){main{padding:12px}.panel{padding:12px}.tabs button{min-width:calc(50% - 7px)}input{width:135px}.stage{padding:8px 0}}
</style></head><body><main><header><h1>Area Model Studio <span class="pill">v1.7 · under development</span></h1><p>One multiplication problem, four connected representations.</p></header>
<section class="panel"><div class="controls"><label>First factor<input id="a" value="34" aria-label="First factor"></label><label>Second factor<input id="b" value="26" aria-label="Second factor"></label></div><div class="error" id="error" role="alert"></div></section>
<section class="panel"><div class="tabs" role="tablist" aria-label="Representation"><button class="active" data-mode="units" role="tab" aria-selected="true">Unit squares</button><button data-mode="squares" role="tab" aria-selected="false">Squares</button><button data-mode="tiles" role="tab" aria-selected="false">Algebra tiles</button><button data-mode="numeric" role="tab" aria-selected="false">Representative / numeric</button><button data-mode="algorithm" role="tab" aria-selected="false">Algorithm</button></div><div class="bar" style="margin-top:14px"><strong id="heading">Squares</strong><span class="muted" id="description"></span></div><div class="stage" id="stage"></div><div class="steps" id="steps"></div></section></main>
<script>
const $=id=>document.getElementById(id);let mode='units',current=null;
const fmt=n=>String(n).replace(/^-/, '−');const signTerm=(c,p,first)=>{if(!c)return '';let s=c<0?'−':first?'':'+';let a=Math.abs(c);return s+(p?(a===1?'':a)+(p===2?'x²':'x'):a)};
function polyText(p){let out='';for(let i=2;i>=0;i--)if(p[i])out+=signTerm(p[i],i,!out);return out||'0'}
function parse(raw){let s=raw.replace(/\s/g,'').replace(/−/g,'-').replace(/\*/g,'').replace(/\(/g,'').replace(/\)/g,'');if(!s||!/^[+\-\dxX]+$/.test(s))throw Error('Use numbers and x, such as 34, 2x+3, or x−5.');s=s.replace(/X/g,'x').replace(/x/g,'x');if(!/^[+-]/.test(s))s='+'+s;let parts=s.match(/[+-][^+-]+/g)||[];let out=[0,0,0];for(let t of parts){let sign=t[0]==='-'?-1:1,v=t.slice(1);if(/^\d+$/.test(v))out[0]+=sign*Number(v);else if(/^(\d*)x$/.test(v))out[1]+=sign*Number(v.slice(0,-1)||1);else throw Error('Each factor can contain constants and x terms (no powers yet).')}if(!Number.isSafeInteger(out[0])||!Number.isSafeInteger(out[1]))throw Error('Number is too large.');return out}
function parts(p){if(p[1]){let a=[];if(p[1])a.push({c:p[1],pow:1});if(p[0])a.push({c:p[0],pow:0});return a}let n=p[0],sg=Math.sign(n)||1,abs=Math.abs(n);if(abs===0)return [{c:0,pow:0}];let digs=String(abs).split('').map((v,i)=>Number(v)*10**(String(abs).length-i-1)).filter(Boolean);return digs.map(c=>({c:c*sg,pow:0}))}
function textTerm(t){return polyText([t.pow===0?t.c:0,t.pow===1?t.c:0,t.pow===2?t.c:0])}
function product(a,b){return {c:a.c*b.c,pow:a.pow+b.pow}}
function result(p,q){return [p[0]*q[0],p[0]*q[1]+p[1]*q[0],p[1]*q[1]]}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cell(t){return safe(textTerm(t))}
function render(){if(!current)return;let {p,q,top,left,r}=current;let hide=false,heading={units:'Unit squares',squares:'Unit squares / partitioned area',tiles:'Algebra tiles',numeric:'Representative / numeric area model',algorithm:'Multiplication algorithm'};let descriptions={units:'Uniform 1 × 1 grid, no place-value boundaries',squares:'Area shown with unit squares where practical',tiles:'x², x, and unit regions',numeric:'Place-value partitions and partial products',algorithm:'Written multiplication or symbolic distribution'};$('heading').textContent=heading[mode];$('description').textContent=descriptions[mode];$('stage').innerHTML='';if(mode==='units')drawUnits(top,left);if(mode==='numeric')drawNumeric(top,left,hide);if(mode==='squares')drawSquares(top,left,hide);if(mode==='tiles')drawTiles(top,left,hide);if(mode==='algorithm')drawAlgorithm(p,q,top,left,hide);let terms=left.flatMap(l=>top.map(t=>product(l,t)));let expansion=terms.map((t,i)=> (i?' + ':'')+'('+textTerm(t)+')').join('').replace(/\+ \(−/g,'− (');$('steps').innerHTML='<strong>Distributive property</strong><div class="math">('+safe(polyText(p))+')('+safe(polyText(q))+') = '+safe(left.map(l=>top.map(t=>'('+textTerm(l)+' × '+textTerm(t)+')').join(' + ')).join(' + '))+'</div>'+(hide?'<div class="muted">Reveal products and totals to complete the calculation.</div>':'<div class="math">Partial products: '+safe(terms.map(textTerm).join(' + ').replace(/\+ −/g,'− '))+'</div><div class="math"><strong>Total: '+safe(polyText(r))+'</strong></div>')}
function drawNumeric(top,left,hide){let grid=document.createElement('div');grid.className='gridModel';let widths=top.map(t=>Math.max(1,Math.abs(t.c)));let heights=left.map(t=>Math.max(1,Math.abs(t.c)));const ratio=arr=>arr.map(n=>Math.max(1,Math.sqrt(n)));grid.style.gridTemplateColumns='65px '+ratio(widths).map(v=>v+'fr').join(' ');grid.style.gridTemplateRows='55px '+ratio(heights).map(v=>Math.max(80,v*28)+'px').join(' ');let add=(cls,txt,sub)=>{let d=document.createElement('div');d.className=cls;d.innerHTML=safe(txt)+(sub?'<small>'+safe(sub)+'</small>':'');grid.appendChild(d)};add('head','×');top.forEach(t=>add('head',textTerm(t)));left.forEach(l=>{add('head',textTerm(l));top.forEach(t=>add('cell',hide?'?':textTerm(product(l,t)),textTerm(l)+' × '+textTerm(t)))});$('stage').appendChild(grid)}
function drawUnits(top,left){let w=top.reduce((s,t)=>s+t.c,0),h=left.reduce((s,t)=>s+t.c,0);if(!top.every(t=>t.pow===0&&t.c>=0)||!left.every(t=>t.pow===0&&t.c>=0)){drawNumeric(top,left,false);let n=document.createElement('p');n.className='tileNote';n.textContent='Unit squares require nonnegative whole-number factors. The numeric area model is shown for this expression.';$('stage').appendChild(n);return}if(w===0||h===0){$('stage').textContent='Zero area: '+w+' × '+h+' = 0';return}let holder=document.createElement('div');holder.style.cssText='overflow:auto;max-width:100%;text-align:center';let unit=Math.min(27,Math.max(3,Math.floor(780/Math.max(w,h))));let svgNS='http://www.w3.org/2000/svg',svg=document.createElementNS(svgNS,'svg');const pad=42;svg.setAttribute('width',String(w*unit+pad+2));svg.setAttribute('height',String(h*unit+pad+2));svg.setAttribute('viewBox',`0 0 ${w*unit+pad+2} ${h*unit+pad+2}`);svg.style.cssText='max-width:none;display:block;margin:auto;background:white';let path=document.createElementNS(svgNS,'path'),d=[];for(let x=0;x<=w;x++)d.push(`M${1+x*unit} 1V${1+h*unit}`);for(let y=0;y<=h;y++)d.push(`M1 ${1+y*unit}H${1+w*unit}`);path.setAttribute('d',d.join(' '));path.setAttribute('fill','none');path.setAttribute('stroke','#7898b5');path.setAttribute('stroke-width','0.8');path.setAttribute('transform','translate(40 40)');svg.appendChild(path);
 const xCuts=[0],yCuts=[0];top.forEach(t=>xCuts.push(xCuts.at(-1)+t.c));left.forEach(t=>yCuts.push(yCuts.at(-1)+t.c));
 const colColors=[[125,96,222],[22,155,185],[35,180,105],[221,136,52]];
 const rowColors=[[239,117,152],[45,177,166],[236,184,54],[100,143,224]];
 for(let ri=0;ri<left.length;ri++)for(let ci=0;ci<top.length;ci++){
  const aa=colColors[ci%colColors.length],bb=rowColors[ri%rowColors.length];
  const mixed=aa.map((v,k)=>Math.min(255,Math.round(0.5*(v+bb[k])+65)));
  let rect=document.createElementNS(svgNS,'rect');
  rect.setAttribute('x',40+xCuts[ci]*unit+1);rect.setAttribute('y',40+yCuts[ri]*unit+1);
  rect.setAttribute('width',top[ci].c*unit);rect.setAttribute('height',left[ri].c*unit);
  rect.setAttribute('fill','rgb('+mixed.join(',')+')');rect.setAttribute('opacity','0.56');svg.insertBefore(rect,path);
 }
 const ns='http://www.w3.org/2000/svg';const txt=(x,y,str,rot)=>{let e=document.createElementNS(ns,'text');e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('text-anchor','middle');e.setAttribute('font-size','13');e.setAttribute('font-weight','600');e.setAttribute('fill','#263d56');if(rot)e.setAttribute('transform',rot);e.textContent=str;svg.appendChild(e)};let xx=40;top.forEach(t=>{txt(xx+t.c*unit/2,24,textTerm(t));xx+=t.c*unit});let yy=40;left.forEach(t=>{txt(18,yy+t.c*unit/2+4,textTerm(t));yy+=t.c*unit});holder.appendChild(svg);$('stage').appendChild(holder);let n=document.createElement('p');n.className='tileNote';n.textContent=`${w} columns × ${h} rows = ${w*h} unit squares. Every grid line has identical weight.`;$('stage').appendChild(n)}
function drawSquares(top,left,hide){
 const numeric=top.every(t=>t.pow===0&&t.c>=0)&&left.every(t=>t.pow===0&&t.c>=0);
 if(!numeric){drawNumeric(top,left,hide);return}
 const w=top.reduce((a,t)=>a+t.c,0),h=left.reduce((a,t)=>a+t.c,0);
 if(!w||!h){$('stage').textContent='Zero area: '+w+' × '+h+' = 0';return}
 // One contiguous region per place-value partial product, not per ten.
 const unit=Math.max(2,Math.min(19,Math.floor(690/Math.max(w,h))));
 const pad=52,ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');
 svg.setAttribute('width',w*unit+pad+2);svg.setAttribute('height',h*unit+pad+2);
 svg.setAttribute('viewBox',`0 0 ${w*unit+pad+2} ${h*unit+pad+2}`);
 svg.style.cssText='display:block;margin:auto;max-width:none';
 const el=(tag,attrs)=>{const e=document.createElementNS(ns,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);svg.appendChild(e);return e};
 const label=(x,y,t,sz=14)=>{const e=el('text',{x,y,'text-anchor':'middle','dominant-baseline':'middle','font-size':sz,'font-weight':700,fill:'#243b51'});e.textContent=t};
 const colors=['#f3d9a7','#c9e2f4','#d5e9d2','#e3d5f4'];
 let y=pad;
 left.forEach((row,ri)=>{
  let x=pad;
  top.forEach((col,ci)=>{
   const ww=col.c*unit,hh=row.c*unit;
   el('rect',{x,y,width:ww,height:hh,fill:colors[(ri+ci)%colors.length]});
   if(unit>=4){
    const d=[];
    for(let k=1;k<col.c;k++)d.push(`M${x+k*unit} ${y}v${hh}`);
    for(let k=1;k<row.c;k++)d.push(`M${x} ${y+k*unit}h${ww}`);
    el('path',{d:d.join(' '),fill:'none',stroke:'#a4b8c5','stroke-width':0.65});
   }
   el('rect',{x,y,width:ww,height:hh,fill:'none',stroke:'#344d66','stroke-width':2.2});
   if(ww>=34&&hh>=28)label(x+ww/2,y+hh/2,hide?'?':String(col.c*row.c),Math.max(11,Math.min(18,Math.min(ww/3,hh/3))));
   x+=ww;
  });
  label(pad-21,y+row.c*unit/2,String(row.c));
  y+=row.c*unit;
 });
 let x=pad;top.forEach(col=>{label(x+col.c*unit/2,pad-20,String(col.c));x+=col.c*unit});
 const wrap=document.createElement('div');wrap.style.cssText='overflow:auto;max-width:100%';wrap.appendChild(svg);$('stage').appendChild(wrap);
 const note=document.createElement('p');note.className='tileNote';note.textContent='Contiguous place-value regions: '+left.map(textTerm).join(' + ')+' by '+top.map(textTerm).join(' + ')+'. Each region shows its partial product.';$('stage').appendChild(note);
}
function drawTiles(top,left,hide){
 const stage=$('stage');const p=current.p,q=current.q;
 if(!p[1]&&!q[1]&&p[0]>=0&&q[0]>=0){
  const bands=n=>{let a=[];for(let i=0;i<Math.floor(n/10);i++)a.push(10);for(let i=0;i<n%10;i++)a.push(1);return a};
  const cols=bands(q[0]),rows=bands(p[0]);
  if(!cols.length||!rows.length){stage.textContent='Zero area';return}
  if(cols.length*rows.length>1800){drawNumeric(top,left,false);return}
  const u=Math.max(5,Math.min(20,Math.floor(680/Math.max(p[0],q[0],1))));
  const gap=2,edge=38;
  const root=document.createElement('div');root.style.cssText='display:grid;gap:'+gap+'px;width:max-content;margin:0 auto;align-items:stretch';
  root.style.gridTemplateColumns=edge+'px '+cols.map(c=>c*u+'px').join(' ');
  root.style.gridTemplateRows=edge+'px '+rows.map(r=>r*u+'px').join(' ');
  const colors={edgeTen:'#b9c7e8',edgeOne:'#e3d8f5',hundred:'#a9cbed',ten:'#c4e2d7',one:'#f5d99c'};
  const cell=(w,h,label,bg,edgeTile)=>{let e=document.createElement('div');e.style.cssText='display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:'+(edgeTile?'2px':'1px')+' solid #536a7d;background:'+bg+';color:#243b51;font-weight:700;font-size:12px;overflow:hidden;min-width:0;min-height:0';e.textContent=label;e.title=label;return e};
  let corner=document.createElement('div');corner.textContent='·';corner.style.cssText='display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700';root.appendChild(corner);
  cols.forEach(c=>root.appendChild(cell(c,1,String(c),c===10?colors.edgeTen:colors.edgeOne,true)));
  rows.forEach(r=>{root.appendChild(cell(1,r,String(r),r===10?colors.edgeTen:colors.edgeOne,true));cols.forEach(c=>root.appendChild(cell(c,r,String(c*r),c===10&&r===10?colors.hundred:c===10||r===10?colors.ten:colors.one,false)))});
  const wrap=document.createElement('div');wrap.style.cssText='overflow:auto;padding:8px';wrap.appendChild(root);stage.appendChild(wrap);
  const note=document.createElement('p');note.className='tileNote';note.textContent='Tens form 10-unit edge tiles; their intersections form 100-square tiles. Remaining units form strips and unit squares.';stage.appendChild(note);return;
 }

 const factorTiles=(v)=>{let arr=[];if(v[1])for(let i=0;i<Math.abs(v[1]);i++)arr.push({pow:1,sign:Math.sign(v[1])});if(v[0])for(let i=0;i<Math.abs(v[0]);i++)arr.push({pow:0,sign:Math.sign(v[0])});return arr};
 const rows=factorTiles(p),cols=factorTiles(q);
 if(!rows.length||!cols.length){stage.textContent='Zero factor: no tiles occupy the area.';return}
 if(rows.length*cols.length>900||rows.length>45||cols.length>45){drawNumeric(top,left,false);let n=document.createElement('p');n.className='tileNote';n.textContent='This product contains too many individual algebra tiles to display legibly. The partitioned model is shown instead.';stage.appendChild(n);return}
 const unit=24, xLength=72, gap=2, label=30;
 const widths=cols.map(t=>t.pow?xLength:unit),heights=rows.map(t=>t.pow?xLength:unit);
 const wrap=document.createElement('div');wrap.style.cssText='width:100%;overflow:auto;padding:8px 0 12px';
 const root=document.createElement('div');root.style.cssText='display:grid;gap:2px;width:max-content;margin:0 auto;align-items:stretch;';root.style.gridTemplateColumns=label+'px '+widths.map(w=>w+'px').join(' ');root.style.gridTemplateRows=label+'px '+heights.map(h=>h+'px').join(' ');
 const add=(t,edge=false)=>{let d=document.createElement('div');d.style.cssText='display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:1.5px solid '+(t.sign<0?'#a44949':edge?'#488368':'#44769e')+';background:'+(t.sign<0?'#f3caca':edge?'#c4e5d4':t.pow===2?'#a8ccef':t.pow===1?'#b8dfe0':'#f6e1ac')+';color:#20364b;font-size:13px;font-weight:650;';d.textContent=(t.sign<0?'−':'')+(t.pow===2?'x²':t.pow===1?'x':'1');return d};
 let corner=document.createElement('div');corner.textContent='·';corner.setAttribute('aria-label','multiply');corner.style.cssText='display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#263e58';root.appendChild(corner);cols.forEach(t=>root.appendChild(add(t,true)));
 rows.forEach(r=>{root.appendChild(add(r,true));cols.forEach(c=>root.appendChild(add({pow:r.pow+c.pow,sign:r.sign*c.sign})))});
 wrap.appendChild(root);stage.appendChild(wrap);
 const note=document.createElement('p');note.className='tileNote';note.textContent=rows.length+' tiles along the left edge × '+cols.length+' tiles along the top edge. Interior tiles represent their pairwise products.';stage.appendChild(note);
}
function drawAlgorithm(p,q,top,left,hide){let d=document.createElement('div');d.className='algorithm';if(!p[1]&&!q[1]&&Number.isInteger(p[0])&&Number.isInteger(q[0])){let a=p[0],b=q[0],digits=String(Math.abs(b)).split('').reverse(),rows=digits.map((digit,i)=>Number(digit)*a*10**i);let lines=['Place value: '+top.map(textTerm).join(' + '),'By: '+left.map(textTerm).join(' + '),String(a),'× '+String(b),'────────',...rows.map((v,i)=>(hide?'?':fmt(v))+'  '+(hide?'':`← ${digits[i]} × ${a} × ${10**i}`)),'────────',hide?'?':fmt(a*b)];d.textContent=lines.join('\n')}else{let lines=['Top: '+top.map(textTerm).join(' + '),'Left: '+left.map(textTerm).join(' + '),`  (${polyText(p)})`,`× (${polyText(q)})`,'────────────',...left.flatMap(l=>top.map(t=>`${textTerm(l)} × ${textTerm(t)} = ${hide?'?':textTerm(product(l,t))}`)),'────────────',hide?'?':polyText(result(p,q))];d.textContent=lines.join('\n')}$('stage').appendChild(d)}
function build(){try{let p=parse($('a').value),q=parse($('b').value);if(Math.max(Math.abs(p[0]),Math.abs(q[0]))>99999||Math.max(Math.abs(p[1]),Math.abs(q[1]))>999)throw Error('For readability, use constants up to 99,999 and x coefficients up to 999.');current={p,q,top:parts(q),left:parts(p),r:result(p,q)};$('error').textContent='';render()}catch(e){$('error').textContent=e.message}}
document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b===btn);b.setAttribute('aria-selected',String(b===btn))});render()});['a','b'].forEach(id=>{ $(id).addEventListener('input',()=>{clearTimeout(window._update);window._update=setTimeout(build,220)});$(id).addEventListener('keydown',e=>{if(e.key==='Enter')build()})});build();
</script></body></html>
